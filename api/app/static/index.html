<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InToday</title>
<meta name="description" content="InToday — a quiet ledger for the day at hand.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#16181a">
<style>
  :root {
    color-scheme: dark;
    --bg: #16181a;
    --bg-edge: #0f1011;
    --card: #1e2124;
    --field: #111314;
    --ink: #e6e8e5;
    --ink-faint: rgba(230, 232, 229, .3);
    --rule: rgba(230, 232, 229, .11);
    --muted: #868e93;
    --red: #ef5b52;
    --green: #43c383;
    --red-bg: rgba(239, 91, 82, .13);
    --green-bg: rgba(67, 195, 131, .13);
    --serif: "Cormorant Garamond", "EB Garamond", Garamond, "Palatino Linotype", "Book Antiqua", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  [hidden] { display: none !important; }
  ::selection { background: var(--green-bg); }
  body { margin: 0; min-height: 100%; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased;
    background: radial-gradient(ellipse at 50% 38%, #212427 0%, var(--bg) 55%, var(--bg-edge) 100%); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* ---------- landing ---------- */
  #landing { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px 20px; }
  main.hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .hero svg { width: min(72vw, 400px, 52vh); height: auto; overflow: visible; }
  .line { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .hero rect.line { stroke: var(--green); }
  .hero circle.line { stroke: var(--red); }
  .guide { fill: none; stroke: var(--ink-faint); stroke-width: .8; vector-effect: non-scaling-stroke; }
  .mark { fill: var(--ink); }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s cubic-bezier(.45, 0, .2, 1) forwards; }
  .draw.late { animation-delay: .7s; }
  .fade { opacity: 0; animation: fade 1.6s ease 1.6s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  h1 { margin: 2.2rem 0 .45rem; font-weight: 400; font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: .32em; text-indent: .32em; text-transform: uppercase; }
  .hero p { margin: 0; font-style: italic; font-size: clamp(1.05rem, 3.2vw, 1.25rem); opacity: .82; }
  footer { margin-top: auto; padding-top: 28px; width: min(92vw, 560px); display: flex; justify-content: space-between; align-items: baseline;
    font-size: .85rem; letter-spacing: .08em; opacity: .8; }
  .gate { margin-top: 2.4rem; width: min(92vw, 600px); text-align: center; }
  .gate button { background: var(--green-bg); border: 1px solid var(--green); color: var(--green); border-radius: 999px; padding: .4em 1.6em; font-style: italic; letter-spacing: .04em; }
  .gate button:hover, .gate button:focus-visible { background: var(--green); color: var(--bg-edge); }
  .gate input { background: var(--field); border: 1px solid var(--ink-faint); border-radius: 6px; padding: .45em .9em; width: min(60vw, 20rem); text-align: center; letter-spacing: .04em; }
  .gate input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
  .gate form { display: flex; gap: .9rem; justify-content: center; align-items: center; flex-wrap: wrap; }
  .note { min-height: 1.4em; margin-top: .6rem; font-size: .9rem; font-style: italic; color: var(--red); }
  .status::before { content: ""; display: inline-block; width: .5em; height: .5em; margin-right: .6em; border-radius: 50%; background: var(--ink-faint); vertical-align: .08em; }
  .status.up::before { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status.down::before { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .mirror { display: inline-block; transform: scaleX(-1); font-style: italic; }
  @media (prefers-reduced-motion: reduce) { .draw, .fade { animation: none; stroke-dashoffset: 0; opacity: 1; } }

  /* ---------- dashboard shell ---------- */
  body.dash { background: var(--bg); }
  #dash { min-height: 100vh; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule);
    display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; align-items: center; padding: .6rem 20px; }
  .brand { font-size: 1.15rem; letter-spacing: .3em; text-transform: uppercase; display: flex; align-items: center; gap: .6rem; margin-right: .4rem; }
  .brand svg { width: 22px; height: 22px; }
  nav#tabs { display: flex; gap: .2rem; overflow-x: auto; flex: 1 1 auto; scrollbar-width: none; }
  nav#tabs::-webkit-scrollbar { display: none; }
  nav#tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: .35rem .8rem; font-style: italic; font-size: 1.05rem; white-space: nowrap; color: var(--muted); }
  nav#tabs button[aria-selected="true"] { border-bottom-color: var(--green); color: var(--green); }
  nav#tabs button:hover { color: var(--ink); }
  nav#tabs button[aria-selected="true"]:hover { color: var(--green); }
  .ctl { display: flex; align-items: center; gap: .5rem; font-size: .95rem; }
  .ctl select { background: var(--field); border: 1px solid var(--rule); border-radius: 6px; padding: .2rem .5rem; }
  .ctl select:hover { border-color: var(--ink-faint); }
  .ctl select option { background: var(--card); color: var(--ink); }
  .ctl button { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: .1rem .55rem; font-size: 1.1rem; color: var(--muted); }
  .ctl button:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .ctl button:disabled { opacity: .3; cursor: default; }
  .ctl .lockbtn { font-size: .9rem; font-style: italic; border: 1px solid var(--red); color: var(--red); border-radius: 999px; padding: .15rem .9rem; }
  .ctl .lockbtn:hover:not(:disabled) { background: var(--red); border-color: var(--red); color: var(--bg-edge); }
  #pulse { font-size: .85rem; font-style: italic; color: var(--muted); white-space: nowrap; }
  #pulse::before { content: ""; display: inline-block; width: .5em; height: .5em; margin-right: .5em; border-radius: 50%; background: var(--green); vertical-align: .08em; }
  #pulse:empty::before { display: none; }
  #pulse.stale { color: var(--red); }
  #pulse.stale::before { background: var(--red); }
  .banner { padding: .45rem 20px; font-size: .95rem; font-style: italic; color: var(--red); background: var(--red-bg); border-bottom: 1px solid var(--red); cursor: pointer; }
  #view { max-width: 1280px; margin: 0 auto; padding: 18px 20px 48px; }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .card { grid-column: span 4; background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 16px 14px; min-width: 0; }
  .card.w4 { grid-column: span 4; } .card.w5 { grid-column: span 5; } .card.w6 { grid-column: span 6; }
  .card.w7 { grid-column: span 7; } .card.w8 { grid-column: span 8; } .card.w12 { grid-column: 1 / -1; }
  .card h3 { margin: 0 0 .6rem; font-weight: 400; font-style: italic; font-size: 1.05rem; letter-spacing: .03em; display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; }
  .card h3 small { font-size: .8rem; color: var(--muted); font-style: italic; }
  .card.kpi { grid-column: span 2; padding: 10px 14px 12px; }
  .kpi .k { font-size: .82rem; font-style: italic; color: var(--muted); }
  .kpi .v { font-size: 1.75rem; line-height: 1.15; font-variant-numeric: oldstyle-nums; margin-top: .1rem; }
  .kpi .v small { font-size: .7rem; opacity: .55; margin-right: .25em; letter-spacing: .06em; }
  .kpi .s { font-size: .8rem; color: var(--muted); margin-top: .15rem; font-variant-numeric: oldstyle-nums; }
  @media (max-width: 1000px) { .card, .card.w4, .card.w5, .card.w6, .card.w7, .card.w8 { grid-column: 1 / -1; } .card.kpi { grid-column: span 4; } }
  @media (max-width: 560px) { .card.kpi { grid-column: span 6; } .bar { padding: .5rem 12px; } #view { padding: 12px 12px 40px; } .brand span { display: none; } }

  /* ---------- parts ---------- */
  .big { font-size: 2.6rem; line-height: 1.05; font-variant-numeric: oldstyle-nums; }
  .big small { font-size: .9rem; opacity: .6; margin-right: .3em; letter-spacing: .06em; }
  .dim { color: var(--muted); } .bad { color: var(--red); } .good { color: var(--green); }
  .plain { margin: 0 0 .3rem; font-size: .95rem; line-height: 1.55; opacity: .88; font-variant-numeric: oldstyle-nums; }
  .empty { margin: 0; font-style: italic; color: var(--muted); font-size: .95rem; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; margin: .6rem 0 0; font-size: .95rem; font-variant-numeric: oldstyle-nums; }
  .kv dt { color: var(--muted); font-style: italic; } .kv dd { margin: 0; text-align: right; }
  table.t { width: 100%; border-collapse: collapse; font-size: .93rem; font-variant-numeric: oldstyle-nums; }
  table.t th { text-align: left; font-weight: 400; font-style: italic; color: var(--muted); font-size: .8rem; padding: 0 .5rem .25rem 0; }
  table.t td { padding: .22rem .5rem .22rem 0; border-top: 1px solid var(--rule); vertical-align: baseline; }
  table.t tbody tr:hover td { background: rgba(255, 255, 255, .025); }
  table.t .n { text-align: right; padding-right: 0; padding-left: .5rem; }
  table.t td.dim { color: var(--muted); }
  .pill { display: inline-block; border: 1px solid var(--ink-faint); border-radius: 999px; padding: 0 .6em; font-size: .78rem; font-style: italic; }
  .pill.good { border-color: var(--green); background: var(--green-bg); } .pill.bad { border-color: var(--red); background: var(--red-bg); }
  .hb { display: grid; grid-template-columns: 6.6rem 1fr 6.4rem; gap: .6rem; align-items: center; padding: .24rem 0; font-size: .93rem; font-variant-numeric: oldstyle-nums; }
  .hb .val { text-align: right; }
  .track { position: relative; height: .55rem; background: var(--rule); border-radius: 3px; }
  .fill { height: 100%; background: var(--muted); border-radius: 3px; }
  .fill.over { background: var(--red); } .fill.green { background: var(--green); }
  .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .8; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 10px; font-style: italic; font-family: var(--serif); }
  .chart .axis { stroke: var(--ink-faint); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .chart .c-ink { fill: var(--muted); opacity: .75; } .chart .c-red { fill: var(--red); } .chart .c-green { fill: var(--green); } .chart .c-faint { fill: var(--ink-faint); }
  .key { margin-top: .5rem; font-size: .82rem; font-style: italic; color: var(--muted); display: flex; flex-wrap: wrap; gap: .3rem 1rem; }
  .key i { display: inline-block; width: .7em; height: .7em; margin-right: .35em; vertical-align: -.05em; border-radius: 2px; }
  .key i.c-ink { background: var(--muted); opacity: .75; } .key i.c-red { background: var(--red); } .key i.c-green { background: var(--green); } .key i.c-faint { background: var(--ink-faint); }
  .more { margin-top: .5rem; background: none; border: 0; padding: 0; font-style: italic; font-size: .9rem; color: var(--green); text-decoration: underline; text-decoration-color: var(--green-bg); text-underline-offset: .25em; }
  .more:hover { text-decoration-color: var(--green); }
  .chips { display: flex; flex-wrap: wrap; gap: .3rem .5rem; margin-bottom: .6rem; }
  .chips button { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 0 .75em; font-size: .85rem; font-style: italic; color: var(--muted); }
  .chips button:hover { border-color: var(--ink-faint); color: var(--ink); }
  .chips button[aria-pressed="true"] { border-color: var(--green); background: var(--green-bg); color: var(--green); }
  .feed { list-style: none; margin: 0; padding: 0; font-size: .93rem; font-variant-numeric: oldstyle-nums; }
  .feed li { display: grid; grid-template-columns: 5.2rem 5.2rem 1fr; gap: .1rem .7rem; padding: .3rem 0; border-top: 1px solid var(--rule); line-height: 1.4; }
  .feed.two li { grid-template-columns: 5rem 1fr; }
  .feed li.bad .sum { color: var(--red); } .feed .when { color: var(--muted); font-size: .85rem; } .feed .kind { font-style: italic; color: var(--green); }
  .feed li.bad .kind { color: var(--red); }
  .feed small { display: block; color: var(--muted); font-size: .82rem; }
  .feed li.solo { display: block; }
  @media (max-width: 560px) { .feed li { grid-template-columns: 4.4rem 1fr; } .feed .kind { grid-column: 2; } .feed .sum { grid-column: 1 / -1; } .feed.two li .sum { grid-column: 2; } }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .78em; }
  .export { display: flex; flex-wrap: wrap; gap: .7rem 1.4rem; align-items: center; font-size: .95rem; }
  .export label { font-style: italic; color: var(--muted); }
  .export select { background: var(--field); border: 1px solid var(--rule); border-radius: 6px; padding: .2em .5em; max-width: 12rem; }
  .export select option { background: var(--card); color: var(--ink); }
  .export .actions { display: flex; gap: .7rem; flex-wrap: wrap; }
  .export button { background: var(--green-bg); border: 1px solid var(--green); color: var(--green); border-radius: 999px; padding: .2em 1.2em; font-style: italic; }
  .export button:hover:not(:disabled) { background: var(--green); color: var(--bg-edge); }
  .export button:disabled { opacity: .5; cursor: default; }
  .hint { margin-top: .6rem; }
</style>
</head>
<body>
<div id="landing">
  <main class="hero">
    <svg viewBox="0 0 400 400" role="img" aria-label="A circle and a square, drawn in proportion">
      <g class="fade">
        <line class="guide" x1="200" y1="30" x2="200" y2="370"/>
        <line class="guide" x1="30" y1="200" x2="370" y2="200"/>
        <line class="guide" x1="70" y1="70" x2="330" y2="330"/>
        <line class="guide" x1="330" y1="70" x2="70" y2="330"/>
        <g class="guide"><path d="M58 70h12M58 102.5h12M58 135h12M58 167.5h12M58 200h12M58 232.5h12M58 265h12M58 297.5h12M58 330h12"/></g>
      </g>
      <rect class="line draw" pathLength="1" x="70" y="70" width="260" height="260"/>
      <circle class="line draw late" pathLength="1" cx="200" cy="190" r="140"/>
      <circle class="mark fade" cx="200" cy="190" r="3"/>
      <circle class="guide fade" cx="200" cy="200" r="6"/>
    </svg>
    <h1>InToday</h1>
    <p>A quiet ledger for the day at hand.</p>
    <section class="gate" aria-label="Open the ledger">
      <button type="button" id="open">Open the ledger</button>
      <form id="unlock" hidden>
        <label for="token" style="position:absolute;left:-9999px">Access token</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="access token" required>
        <button type="submit">Unlock</button>
      </form>
      <div class="note" id="note" role="status" aria-live="polite"></div>
    </section>
  </main>
  <footer>
    <span class="status" id="status">&nbsp;</span>
    <span class="mirror" aria-hidden="true">InToday</span>
  </footer>
</div>

<div id="dash" hidden>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="11.5" r="8.5" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="11.5" r="1.4" fill="var(--green)"/></svg>
      <span>InToday</span>
    </div>
    <nav id="tabs" role="tablist" aria-label="Views"></nav>
    <div class="ctl">
      <button type="button" id="m-prev" aria-label="Earlier month">&#8249;</button>
      <select id="m-sel" aria-label="Month"></select>
      <button type="button" id="m-next" aria-label="Later month">&#8250;</button>
      <span id="pulse" role="status"></span>
      <button type="button" class="lockbtn" id="lock">Lock</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div id="view" role="tabpanel"></div>
</div>

<script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const KEY = "intoday-ledger-token", MKEY = "intoday-ledger-month";
    const TABS = [["overview", "Overview"], ["spending", "Spending"], ["money", "Money"], ["reports", "Reports"], ["system", "System"]];
    const TAG_NAMES = { food: "Food", transport: "Transport", dataAirtime: "Data & airtime", fun: "Fun", shopping: "Shopping", other: "Other" };
    let D = null, S = null, timer = null, lastKey = "", headerKey = "";
    const ui = { view: "overview", month: null, expShown: 15, expTag: "all", feedAll: false };

    // ---------- storage ----------
    const store = {
      get: (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
      set: (k, v) => { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} },
    };
    const token = () => store.get(KEY);

    // ---------- tiny DOM kit (text is always set as text, never as HTML) ----------
    function h(tag, cls, kids) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      [].concat(kids === undefined ? [] : kids).forEach((k) => {
        if (k === null || k === undefined || k === false) return;
        n.appendChild(typeof k === "object" ? k : document.createTextNode(String(k)));
      });
      return n;
    }
    const NS = "http://www.w3.org/2000/svg";
    function sv(name, attrs, kids) {
      const n = document.createElementNS(NS, name);
      Object.keys(attrs || {}).forEach((k) => n.setAttribute(k, attrs[k]));
      [].concat(kids || []).forEach((k) => n.appendChild(typeof k === "object" ? k : document.createTextNode(String(k))));
      return n;
    }
    const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
    function button(cls, text, fn) { const b = h("button", cls, text); b.type = "button"; b.onclick = fn; return b; }

    // ---------- formatting ----------
    const num = (n) => Number(n).toLocaleString();
    const label = (t) => t.replace(/_/g, " ");
    const short = (id) => (id && id.length > 13 ? id.slice(0, 8) + "…" : id);
    function ago(iso) {
      const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 45) return "just now";
      if (s < 3600) return Math.round(s / 60) + " min ago";
      if (s < 86400) return Math.round(s / 3600) + " h ago";
      return Math.round(s / 86400) + " d ago";
    }
    function clock(iso) {
      const d = new Date(iso), t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + t;
    }
    const when = (iso) => (iso ? new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "never");
    const dur = (s) => (s < 90 ? s + " s" : s < 5400 ? Math.round(s / 60) + " min" : s < 172800 ? Math.round(s / 3600) + " h" : Math.round(s / 86400) + " d");
    const ms = (v) => (v < 10 ? v.toFixed(1) : Math.round(v)) + " ms";
    const day = (iso) => { const p = String(iso).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString([], { day: "numeric", month: "short" }); };
    const monthName = (m) => { const p = m.split("-"); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString([], { month: "long", year: "numeric" }); };
    const pct = (a, b) => (b > 0 ? Math.max(0, Math.min(100, (a / b) * 100)) : 0);
    const two = (n) => String(n).padStart(2, "0");
    const todayIso = () => { const n = new Date(); return n.getFullYear() + "-" + two(n.getMonth() + 1) + "-" + two(n.getDate()); };

    // ---------- building blocks ----------
    function card(title, sub, cls, kids) {
      return h("section", "card " + (cls || ""), [h("h3", "", [h("span", "", title), sub ? h("small", "", sub) : null])].concat(kids));
    }
    function kpi(k, value, sub, cls) { return h("div", "card kpi", [h("div", "k", k), h("div", "v " + (cls || ""), [h("small", "", "UGX"), num(value)]), h("div", "s", sub || "")]); }
    function kpiText(k, value, sub) { return h("div", "card kpi", [h("div", "k", k), h("div", "v", value), h("div", "s", sub || "")]); }
    const pill = (text, kind) => h("span", "pill " + (kind || ""), text);
    // Cells: a string/number, or {text, dim} or {node}.
    function table(headers, rows, rightFrom) {
      const t = h("table", "t"), head = h("tr"), right = (i) => rightFrom !== undefined && i >= rightFrom;
      headers.forEach((x, i) => head.appendChild(h("th", right(i) ? "n" : "", x)));
      t.appendChild(head);
      rows.forEach((r) => {
        const tr = h("tr");
        r.forEach((c, i) => {
          const obj = c !== null && typeof c === "object";
          tr.appendChild(h("td", (right(i) ? "n" : "") + (obj && c.dim ? " dim" : ""), obj ? (c.node || c.text) : c));
        });
        t.appendChild(tr);
      });
      return t;
    }
    const empty = (text) => h("p", "empty", text);
    function hbar(name, value, max, shown, cls, tickAt) {
      const t = h("div", "track"), f = h("div", "fill " + (cls || ""));
      f.style.width = pct(value, max) + "%"; t.appendChild(f);

      $("m-next").disabled = !(i > 0);
      const ls = S && S.last_sync, stale = ls && ls.at && Date.now() - new Date(ls.at).getTime() > 24 * 3600 * 1000;
      $("pulse").textContent = !S ? "" : ls.at ? "synced " + ago(ls.at) : "waiting for the app";
      $("pulse").className = stale ? "stale" : "";
      const b = $("banner"), alerts = S ? S.alerts : [];
      b.hidden = !alerts.length || ui.view === "system";
      if (!b.hidden) { b.textContent = "❧ " + alerts[0].text + (alerts.length > 1 ? " (+" + (alerts.length - 1) + " more)" : "") + " — open System"; b.onclick = () => { location.hash = "#/system"; }; }
    }
    function draw(force) {
      drawHeader();
      if (!D || !S) return;
      const key = ui.view + "|" + (ui.view === "system" ? JSON.stringify(S) : JSON.stringify(D) + (ui.view === "reports" ? S.records.total : ""));
      if (!force && key === lastKey) return;
      lastKey = key;
      const y = window.scrollY, v = clear($("view"));
      v.appendChild(D.month || ui.view === "system" ? VIEWS[ui.view]() : noMonth());
      window.scrollTo(0, y);
    }
    function setViewFromHash() {
      const m = /^#\/(\w+)/.exec(location.hash), name = m && VIEWS[m[1]] ? m[1] : "overview";
      if (name !== ui.view) { ui.view = name; ui.expShown = 15; window.scrollTo(0, 0); }
      drawTabs(); lastKey = ""; draw(true);
    }

    // ---------- data ----------
    async function get(path) {
      const r = await fetch(path, { headers: { Authorization: "Bearer " + token() }, cache: "no-store" });
      let data = null; try { data = await r.json(); } catch (e) {}
      return { status: r.status, data };
    }
    async function refresh() {
      const qs = ui.month ? "?year=" + ui.month.slice(0, 4) + "&month=" + parseInt(ui.month.slice(5), 10) : "";
      const [d, s] = await Promise.all([get("/v1/dashboard" + qs), get("/v1/stats")]);
      if (d.status === 401 || s.status === 401) { lock("That token was not accepted."); throw new Error("401"); }
      if (d.status === 429 || s.status === 429) { $("pulse").textContent = "too many requests, pausing"; throw new Error("429"); }
      if (d.status === 404 && ui.month) { ui.month = null; store.set(MKEY, null); return refresh(); }
      if (d.status !== 200 || s.status !== 200) { $("pulse").textContent = "could not be read"; $("pulse").className = "stale"; throw new Error("read"); }
      D = d.data; S = s.data;
      ui.month = D.month; store.set(MKEY, D.month);
    }
    function poll() { if (!document.hidden && token()) refresh().then(() => draw(false)).catch(() => {}); }
    function enter() {
      $("landing").hidden = true; $("dash").hidden = false; document.body.className = "dash"; document.title = "InToday · Ledger";
      if (!timer) timer = setInterval(poll, 15000);
      setViewFromHash();
    }
    function lock(message) {
      store.set(KEY, null); store.set(MKEY, null); clearInterval(timer); timer = null; D = S = null; lastKey = headerKey = ""; ui.month = null;
      $("dash").hidden = true; $("landing").hidden = false; document.body.className = ""; document.title = "InToday";
      history.replaceState(null, "", location.pathname);
      $("unlock").hidden = !message; $("open").hidden = !!message; $("note").textContent = message || "";
    }

    // ---------- wiring ----------
    fetch("/healthz", { cache: "no-store" }).then((r) => r.json()).then((j) => {
      const ok = j.status === "ok" || j.status === "degraded";
      $("status").textContent = ok ? "In operation" : "Resting";
      $("status").className = ok ? "status up" : "status down";
    }).catch(() => { $("status").textContent = "Unreachable"; $("status").className = "status down"; });

    $("open").onclick = () => { $("open").hidden = true; $("unlock").hidden = false; $("token").focus(); };
    $("unlock").onsubmit = (e) => {
      e.preventDefault();
      const t = $("token").value.trim();
      if (!t) return;
      store.set(KEY, t);
      refresh().then(() => { $("token").value = ""; $("note").textContent = ""; enter(); }).catch((err) => {
        if (err.message === "401") return; // lock() already explained
        store.set(KEY, null);
        $("note").textContent = err.message === "429" ? "Too many attempts. Wait a moment." : "The ledger could not be read.";
      });
    };
    $("lock").onclick = () => lock("");
    const goMonth = (m) => { ui.month = m; lastKey = ""; poll(); };
    $("m-sel").onchange = () => goMonth($("m-sel").value);
    $("m-prev").onclick = () => { const i = D.months.indexOf(D.month); if (i < D.months.length - 1) goMonth(D.months[i + 1]); };
    $("m-next").onclick = () => { const i = D.months.indexOf(D.month); if (i > 0) goMonth(D.months[i - 1]); };
    window.addEventListener("hashchange", () => { if (D) setViewFromHash(); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

    if (token()) {
      ui.month = store.get(MKEY);
      refresh().then(enter).catch((err) => { if (token() && err.message !== "401") $("note").textContent = "The ledger could not be read."; });
    }
  })();
</script>
</body>
</html>
