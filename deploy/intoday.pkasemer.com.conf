# Bootstrap server block for the host nginx — HTTP only on purpose.
# deploy/install-nginx.sh installs this, then `certbot --nginx` turns it into the HTTPS
# server (adds listen 443 ssl + the certificate paths, plus an http->https redirect), copying
# the directives below into the 443 block. The api listens on 127.0.0.1:8100 (API_PORT in .env).
server {
    listen 80;
    listen [::]:80;
    server_name intoday.pkasemer.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 4m;   # matches the api's own 4 MB body cap

    # Only the API surface is proxied; everything else 404s.
    location ~ ^/(v1/|healthz$) {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering off;   # MCP clients may hold the connection open
    }
    location / { return 404; }
}
